
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-toolkit"
version = "0.1.0"
description = "Outils communs de développement pour les laboratoires"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
lab-toolkit = "lab_toolkit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "ruff==0.17.4",
    "pre-commit>=4.7,<5",
    "pre-commit-hooks==6.0.0",
]

[tool.ruff]
target-version = "py314"
line-length = 88
src = ["src"]

[tool.ruff.lint]
select = [
    "E4",
    "E7",
    "E9",
    "F",
    "I",
    "UP",
    "B",
    "SIM",
]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
line-ending = "lf"

[tool.pytest.ini_options]
testpaths = ["tests"]
