
[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "lab-toolkit"
version = "0.1.0"
description = "Outils communs de développement pour les laboratoires"
readme = "README.md"
requires-python = ">=3.14"
dependencies = []

[project.scripts]
lab-toolkit = "lab_toolkit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]